name: Build iPad model-key reader
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile standalone device reader
        run: |
          mkdir -p build/ipad-tool
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 \
            -Wall -Wextra -Werror tools/ipad-model-keys.c \
            -framework CoreFoundation -framework Security -o build/ipad-tool/ipad-model-keys
          lipo build/ipad-tool/ipad-model-keys -verify_arch arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ipad-model-key-reader
          path: build/ipad-tool/ipad-model-keys
          if-no-files-found: error
          retention-days: 14
